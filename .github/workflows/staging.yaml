name: Build

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: proof-arrive-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}

      - name: Build and push Docker images
        run: |
          # Create empty .env file to satisfy docker-compose's default behavior
          # docker-compose-build.yml doesn't use .env, but docker-compose looks for it by default
          # This prevents "env file not found" errors that cause build failures
          echo "# Empty .env file for docker-compose" > .env
          echo "DATABASE_PASSWORD=" >> .env
          # Verify file was created
          ls -la .env
          # Build and push images
          # Note: Warnings about DATABASE_PASSWORD are harmless (docker-compose-build.yml doesn't use variables)
          docker compose -f docker-compose-build.yml build
          docker compose -f docker-compose-build.yml push
      - name: Delete old container images (keep 5 latest)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          OWNER="${{ github.repository_owner }}"
          PACKAGE="${{ env.IMAGE_NAME }}"
          # Try org API first, then user (for user-owned repos)
          VERSIONS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/orgs/$OWNER/packages/container/$PACKAGE/versions?per_page=100")
          if echo "$VERSIONS" | grep -q '"message":"Not Found"'; then
            VERSIONS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/user/packages/container/$PACKAGE/versions?per_page=100")
            BASE_URL="https://api.github.com/user/packages/container/$PACKAGE/versions"
          else
            BASE_URL="https://api.github.com/orgs/$OWNER/packages/container/$PACKAGE/versions"
          fi
          if echo "$VERSIONS" | grep -q '"message":"Not Found"'; then
            echo "Package not found or no access; skipping cleanup."
            exit 0
          fi
          # Response must be an array; API can return an object on error
          if ! echo "$VERSIONS" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "Unexpected API response (not an array); skipping cleanup."
            exit 0
          fi
          echo "Keeping $KEEP latest versions..."
          TO_DELETE=$(echo "$VERSIONS" | jq -r --argjson keep $KEEP 'if type == "array" then .[$keep:] | .[].id else empty end')
          if [ -z "$TO_DELETE" ]; then
            echo "No old versions to delete."
            exit 0
          fi
          for id in $TO_DELETE; do
            echo "Deleting version id: $id"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$BASE_URL/$id" || true
          done
          echo "Cleanup done."

      - name: Notify Portainer
        if: always()
        continue-on-error: true
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"status": "success", "message": "Image successfully built and pushed"}' \
            "${{ secrets.PORTAINER_WEBHOOK_URL }}" || echo "Portainer notification failed (non-critical)"
            
