services:
  proof-arrive-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        # Note: DATABASE_HOST should be an accessible hostname/IP during build
        # For local builds, use 'localhost' or skip build-time migrations
        # For CI/CD, use the actual database hostname/IP
        DATABASE_HOST: ${DATABASE_HOST:-}
        DATABASE_PORT: ${DATABASE_PORT:-5432}
        DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
        DATABASE_NAME: ${DATABASE_NAME:-proof_arrive}
        SKIP_BUILD_MIGRATIONS: ${SKIP_BUILD_MIGRATIONS:-true}
        REQUIRE_BUILD_MIGRATIONS: ${REQUIRE_BUILD_MIGRATIONS:-false}
    image: proof-arrive-api:latest
    container_name: proof-arrive-api
    restart: unless-stopped
    # Note: env_file is not needed for build/push operations
    # Environment variables are passed via build args above
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proof-arrive-network

  postgres:
    image: postgres:16-alpine
    container_name: proof-arrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-proof_arrive}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proof-arrive-network

volumes:
  postgres_data:

networks:
  proof-arrive-network:
    driver: bridge
