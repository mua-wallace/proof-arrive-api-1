version: '3.8'

services:
  proof-arrive-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: proof-arrive-api
    restart: unless-stopped
    ports:
      - '5001:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: proof_arrive
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proof-arrive-network

  postgres:
    image: postgres:16-alpine
    container_name: proof-arrive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proof_arrive
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  proof-arrive-network:
    driver: bridge

